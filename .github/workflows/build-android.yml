name: Build Android APK

on:
  push:
    branches: [master, main]
  workflow_dispatch:  # Manual trigger from Actions tab

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Configure EAS
        run: eas build:configure --platform android --non-interactive

      - name: Build APK (preview profile)
        run: eas build -p android --profile preview --non-interactive

      - name: Download APK artifact
        run: |
          BUILD_URL=$(eas build:list --platform=android --limit=1 --json | jq -r '.[0].artifacts.buildUrl')
          echo "Build URL: $BUILD_URL"
          curl -L -o app.apk "$BUILD_URL"

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: blockfall-apk
          path: app.apk
          retention-days: 30
